[project]
name = "ods-berlin-bot"
version = "0.1.0"
description = "Weekly ODS Berlin breakfast announcement"
requires-python = ">=3.13"
dependencies = [
    "python-telegram-bot>=22.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

